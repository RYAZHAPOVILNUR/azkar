# /etc/nginx/sites-available/azkar.nurtech.dev
# ln -s → sites-enabled, затем: certbot --nginx -d azkar.nurtech.dev

server {
    listen 80;
    server_name azkar.nurtech.dev;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# После `certbot --nginx -d azkar.nurtech.dev` этот блок дополнится
# слушателем 443 с SSL-сертификатом Let's Encrypt автоматически.
